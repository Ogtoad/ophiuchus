<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ophiuchus</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- The titlebar this window doesn't have. Invisible, and thin enough to sit
       entirely in the workspace/panel padding, so it drags the window without
       covering anything you can click. Deliberately NOT electrobun's
       `electrobun-webkit-app-region-drag` class: that hook reaches a
       startWindowMove the Windows native layer never implements, and the press
       goes nowhere. workspaceIndex drives it through the portable window API. -->
  <div id="titlebar"></div>
  <!-- The one piece of visible chrome: close. HTML, not OS — Windows knows
       nothing about it, so it changes nothing about the frameless window. -->
  <div id="closeBtn" title="close">×</div>

  <div id="workspace"></div>

  <!-- Panel pool: the workspace hoists each [data-box] into a tiling box.
       No topbars, no frames — the panels are nothing but their content.
       ONE input in the whole app: the console's live prompt, which is the last
       line of the console's own scroll. Ctrl+Enter runs it, Alt/AltGr+Enter
       sends it to the familiar. Alt+drag a panel to rearrange the layout. -->
  <div id="pool" hidden>

    <section id="console" class="panel" data-box="console">
      <!-- History and the live prompt share one scroll, like a real terminal.
           #inputRow is always the last child; entries insert before it. -->
      <div id="output" class="output">
        <div id="inputRow" class="input-line live">
          <span id="ps1" class="ps">&gt;&gt;&gt;</span>
          <div class="input-surface">
            <pre id="overlay" class="overlay" aria-hidden="true"></pre>
            <textarea id="input" rows="1" spellcheck="false" autocomplete="off"
                      autocapitalize="off" autocorrect="off"></textarea>
          </div>
        </div>
      </div>
    </section>

    <!-- Conversation only. The familiar's code and its output live in the
         console, because there is one kernel and therefore one console. -->
    <section id="familiar" class="panel" data-box="familiar">
      <div class="fmain">
        <div class="watermark">ophiuchus</div>
        <div id="fchat" class="fchat"></div>
      </div>
    </section>

  </div>

  <script src="workspaceIndex.js"></script>
</body>
</html>
