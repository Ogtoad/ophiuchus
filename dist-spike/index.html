<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ophiuchus Spike</title>
  <link rel="stylesheet" href="index.css">
  <style>
    /* Spike-local chrome — mirrors the real app's invisible regions. */
    #titlebar { position: fixed; top: 0; left: 0; right: 0; height: 24px; z-index: 50; }
    #closeBtn { position: fixed; top: 4px; right: 8px; z-index: 60; cursor: pointer; color: #888; font: 16px monospace; }
    .wedge { position: fixed; z-index: 55; }
    .wedge.n { top: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
    .wedge.s { bottom: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
    .wedge.e { right: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
    .wedge.w { left: 0; top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
    .wedge.nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .wedge.se { bottom: 0; right: 0; width: 10px; height: 10px; cursor: nwse-resize; }
    .wedge.ne { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    .wedge.sw { bottom: 0; left: 0; width: 10px; height: 10px; cursor: nesw-resize; }
    #spike { padding: 36px 20px 20px; font-family: var(--mono, monospace); font-size: 12px; color: #e0e0e0; }
    #results { white-space: pre-wrap; color: #8fd; }
    body { background: #080808; margin: 0; }
  </style>
</head>
<body>
  <div id="titlebar" data-tauri-drag-region></div>
  <div id="closeBtn" title="close">×</div>
  <div id="spike">
    <div>ophiuchus tauri spike — phase 0 gates</div>
    <pre id="results"></pre>
    <div class="output" style="margin-top: 16px; max-width: 600px;">
      <div id="inputRow" class="input-line live">
        <span id="ps1" class="ps">In [1]:</span>
        <div class="input-surface">
          <pre id="overlay" class="overlay" aria-hidden="true"></pre>
          <textarea id="input" rows="1" spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </div>
  <script src="spike.js"></script>
</body>
</html>
